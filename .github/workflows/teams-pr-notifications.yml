name: Teams PR Notifications

on:
  pull_request:
    types: [opened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: read

jobs:
  notify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # 1. PR Aberto / Ready for Review
      - name: Notify PR Ready for Review
        if: github.event.action == 'opened' || github.event.action == 'ready_for_review'
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            --arg branch "$PR_BRANCH" \
            --arg base "$BASE_BRANCH" \
            '{
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": "📢 Pull Request Ready for Review",
                        "weight": "Bolder",
                        "size": "Medium",
                        "color": "Accent"
                      },
                      {
                        "type": "TextBlock",
                        "text": "Hey <at>Devs</at>, please review this pull request:",
                        "wrap": true
                      },
                      {
                        "type": "FactSet",
                        "facts": [
                          { "title": "Title:", "value": $title },
                          { "title": "Author:", "value": $author },
                          { "title": "Branch:", "value": ($branch + " → " + $base) },
                          { "title": "Status:", "value": "⏳ In Review" }
                        ]
                      }
                    ],
                    "actions": [
                      {
                        "type": "Action.OpenUrl",
                        "title": "Review on GitHub",
                        "url": $url
                      }
                    ],
                    "msteams": {
                      "entities": [
                        {
                          "type": "mention",
                          "text": "<at>Devs</at>",
                          "mentioned": {
                            "id": "channel",
                            "name": "Devs"
                          }
                        }
                      ]
                    }
                  }
                }
              ]
            }')

          echo "Sending payload to Teams..."
          RESPONSE=$(curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK" -w "\nHTTP_STATUS: %{http_code}\n")
          echo "$RESPONSE"

      # 2. Review Submetido
      - name: Notify Review Submitted
        if: github.event_name == 'pull_request_review'
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          case "$REVIEW_STATE" in
            "approved") STATUS="✅ Approved" ;;
            "changes_requested") STATUS="⚠️ Changes Requested" ;;
            "commented") STATUS="💬 Comments Added" ;;
            *) STATUS="ℹ️ Review Submitted ($REVIEW_STATE)" ;;
          esac

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg reviewer "$REVIEWER" \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg body "${REVIEW_BODY:-No additional comments provided.}" \
            '{
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": ("📋 Review Update: " + $status),
                        "weight": "Bolder",
                        "size": "Medium"
                      },
                      {
                        "type": "FactSet",
                        "facts": [
                          { "title": "Reviewer:", "value": $reviewer },
                          { "title": "Decision:", "value": $status },
                          { "title": "Pull Request:", "value": $title }
                        ]
                      },
                      {
                        "type": "TextBlock",
                        "text": ("**Feedback:**\n" + $body),
                        "wrap": true
                      }
                    ],
                    "actions": [
                      {
                        "type": "Action.OpenUrl",
                        "title": "View Review",
                        "url": $url
                      }
                    ]
                  }
                }
              ]
            }')

          echo "Sending review to Teams..."
          RESPONSE=$(curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK" -w "\nHTTP_STATUS: %{http_code}\n")
          echo "$RESPONSE"

      # 3. Merge / Fechamento do PR
      - name: Notify PR Closed or Merged
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          IS_MERGED: ${{ github.event.pull_request.merged }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$IS_MERGED" = "true" ]; then
            HEADER="✅ Pull Request Merged"
            STATUS_LABEL="🎉 Merged"
            COLOR="Good"
            DESC="The pull request has been merged into '$BASE_BRANCH'."
          else
            HEADER="❌ Pull Request Closed"
            STATUS_LABEL="❌ Closed / Cancelled"
            COLOR="Attention"
            DESC="The pull request was closed without merging."
          fi

          PAYLOAD=$(jq -n \
            --arg header "$HEADER" \
            --arg color "$COLOR" \
            --arg statusLabel "$STATUS_LABEL" \
            --arg desc "$DESC" \
            --arg title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg branch "$PR_BRANCH" \
            --arg base "$BASE_BRANCH" \
            --arg actor "$ACTOR" \
            --arg url "$PR_URL" \
            '{
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": $header,
                        "weight": "Bolder",
                        "size": "Medium",
                        "color": $color
                      },
                      {
                        "type": "TextBlock",
                        "text": $desc,
                        "wrap": true
                      },
                      {
                        "type": "FactSet",
                        "facts": [
                          { "title": "Title:", "value": $title },
                          { "title": "Author:", "value": $author },
                          { "title": "Action By:", "value": $actor },
                          { "title": "Branch:", "value": ($branch + " → " + $base) },
                          { "title": "Status:", "value": $statusLabel }
                        ]
                      }
                    ],
                    "actions": [
                      {
                        "type": "Action.OpenUrl",
                        "title": "View Pull Request",
                        "url": $url
                      }
                    ]
                  }
                }
              ]
            }')

          echo "Sending close/merge status to Teams..."
          RESPONSE=$(curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK" -w "\nHTTP_STATUS: %{http_code}\n")
          echo "$RESPONSE"