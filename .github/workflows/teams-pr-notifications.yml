name: Teams PR Notifications

on:
  pull_request:
    types:
      - ready_for_review
      - review_requested
      - closed

  pull_request_review:
    types:
      - submitted

jobs:
  notify-pr-opened:
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'

    runs-on: ubuntu-latest

    steps:
      - name: Notify Teams - PR Ready For Review
        run: |
          curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "event":"pr_opened",
            "repository":"${{ github.repository }}",
            "prNumber":"${{ github.event.pull_request.number }}",
            "title":"${{ github.event.pull_request.title }}",
            "author":"${{ github.event.pull_request.user.login }}",
            "sourceBranch":"${{ github.event.pull_request.head.ref }}",
            "targetBranch":"${{ github.event.pull_request.base.ref }}",
            "url":"${{ github.event.pull_request.html_url }}"
          }'

  notify-review-requested:
    if: github.event_name == 'pull_request' && github.event.action == 'review_requested'

    runs-on: ubuntu-latest

    steps:
      - name: Notify Teams - Review Requested
        run: |
          curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "event":"review_requested",
            "repository":"${{ github.repository }}",
            "prNumber":"${{ github.event.pull_request.number }}",
            "title":"${{ github.event.pull_request.title }}",
            "requestedReviewer":"${{ github.event.requested_reviewer.login }}",
            "url":"${{ github.event.pull_request.html_url }}"
          }'

  notify-approved:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'

    runs-on: ubuntu-latest

    steps:
      - name: Notify Teams - Approved
        run: |
          curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "event":"approved",
            "repository":"${{ github.repository }}",
            "prNumber":"${{ github.event.pull_request.number }}",
            "title":"${{ github.event.pull_request.title }}",
            "reviewer":"${{ github.event.review.user.login }}",
            "url":"${{ github.event.pull_request.html_url }}"
          }'

  notify-merged:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Notify Teams - Merged
        run: |
          curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "event":"merged",
            "repository":"${{ github.repository }}",
            "prNumber":"${{ github.event.pull_request.number }}",
            "title":"${{ github.event.pull_request.title }}",
            "mergedBy":"${{ github.event.pull_request.merged_by.login }}",
            "url":"${{ github.event.pull_request.html_url }}"
          }'

  notify-closed:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false

    runs-on: ubuntu-latest

    steps:
      - name: Notify Teams - Closed
        run: |
          curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "event":"closed",
            "repository":"${{ github.repository }}",
            "prNumber":"${{ github.event.pull_request.number }}",
            "title":"${{ github.event.pull_request.title }}",
            "url":"${{ github.event.pull_request.html_url }}"
          }'